<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shailesh Patel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=3">
    <link rel="stylesheet" href="print.css" media="print">
</head>

<body>
    <button onclick="downloadPDF()"
        class="btn btn-light btn-sm shadow-sm position-fixed top-0 start-0 m-3 d-print-none d-none"
        style="z-index: 1000;">
        ⬇️ Download PDF
    </button>

    <div class="container">
        <div class="paper-sheet p-4 p-lg-5 shadow-lg">
            <header class="text-center mb-3 border-bottom pb-4">
                <h2 class="fw-bold text-uppercase name-title" id="name">Loading...</h2>
                <p class="lead mb-2" id="title"></p>
                <div class="contact-info small text-muted" id="contact"></div>
            </header>

            <section class="mb-4">
                <h2 class="h4 text-uppercase border-bottom pb-2 mb-3 section-title">Professional Summary</h2>
                <p id="summary"></p>
            </section>

            <div class="row">
                <div class="col-lg-7 pe-lg-4" id="left-column">
                    <section class="mb-4">
                        <h2 class="h4 text-uppercase border-bottom pb-2 mb-3 section-title">Experience</h2>
                        <div id="experience-list"></div>
                    </section>

                    <section class="mb-4" id="projects-section">
                        <h2 class="h4 text-uppercase border-bottom pb-2 mb-3 section-title">Projects</h2>
                        <div id="projects-list"></div>
                    </section>
                </div>

                <div class="col-lg-5 ps-lg-4" id="right-column">
                    <section class="mb-4">
                        <h2 class="h4 text-uppercase border-bottom pb-2 mb-3 section-title">Skills</h2>
                        <div id="skills-list"></div>
                    </section>

                    <section class="mb-4" id="education-section">
                        <h2 class="h4 text-uppercase border-bottom pb-2 mb-3 section-title">Education</h2>
                        <div id="education-list"></div>
                    </section>

                    <section class="mb-4" id="certifications-section">
                        <h2 class="h4 text-uppercase border-bottom pb-2 mb-3 section-title">Certifications</h2>
                        <div id="certifications-list"></div>
                    </section>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
